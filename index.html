<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Heavy Metal</title>
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Heavy Metal">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <svg class="bolt" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
  <h1>Heavy Metal</h1>
  <span class="tag">lift loud</span>
</header>

<main id="view"></main>

<div id="timer"></div>

<nav id="tabs">
  <button data-tab="train"><svg viewBox="0 0 24 24"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></svg>Train</button>
  <button data-tab="lib"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Library</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M3 20h18M6 16l4-5 4 3 5-8"/></svg>Stats</button>
  <button data-tab="run"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Run</button>
  <button data-tab="data"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 20h16"/></svg>Data</button>
</nav>

<div id="alarm" hidden><div><div class="big">Rest over</div><p>Back under the bar 🤘</p><small>tap to dismiss</small></div></div>
<div id="toast" hidden></div>
<input type="file" id="file" accept=".json,application/json" hidden>

<script src="mascots.js"></script>
<script src="app.js"></script>
</body>
</html>
